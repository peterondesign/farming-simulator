  <rect x="15" y="17" width="2" height="5" fill="#c43c28"/>
  <rect x="12" y="19" width="3" height="1" fill="#c43c28"/>
  <rect x="17" y="19" width="3" height="1" fill="#c43c28"/>
  <!-- gold wheat sprig -->
  <rect x="24" y="16" width="2" height="6" fill="#7a5428"/>
  <rect x="23" y="14" width="2" height="2" fill="#e0b429"/>
  <rect x="25" y="13" width="2" height="2" fill="#f0c84a"/>
  <rect x="24" y="12" width="2" height="2" fill="#ffe08a"/>
