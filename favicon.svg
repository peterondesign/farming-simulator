<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Farming Simulator</title>
  <rect width="32" height="32" rx="6" fill="#1a2212"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#2d4a1c"/>
  <!-- grass diamond -->
  <rect x="15" y="20" width="2" height="8" fill="#3f6a28"/>
  <rect x="11" y="22" width="10" height="4" fill="#4c7d30"/>
  <rect x="7" y="24" width="18" height="2" fill="#3f6a28"/>
  <rect x="13" y="26" width="6" height="2" fill="#2f551c"/>
  <!-- barn roof -->
  <rect x="8" y="6" width="16" height="2" fill="#5c6166"/>
  <rect x="6" y="8" width="20" height="2" fill="#6e747a"/>
  <rect x="6" y="10" width="20" height="2" fill="#4e545a"/>
  <rect x="8" y="8" width="4" height="2" fill="#8a9096"/>
