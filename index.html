<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farming Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script async src="https://tally.so/widgets/embed.js"></script>
  </head>
  <body>
    <main class="stage">
      <div class="frame">
        <canvas id="game" aria-label="Farming simulator"></canvas>
        <button
          class="feedback"
          type="button"
          data-tally-open="810XRA"
          data-tally-emoji-text="👋"
          data-tally-emoji-animation="wave"
        >
          Feedback
        </button>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
