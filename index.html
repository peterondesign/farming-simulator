<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farming Simulator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="feedback" aria-label="Feedback">
      <iframe
        data-tally-src="https://tally.so/embed/810XRA?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="180"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Feedback"
      ></iframe>
    </header>
    <main class="stage">
      <canvas id="game" width="960" height="640" aria-label="Farming simulator"></canvas>
      <p id="hint" class="hint">Arrows or WASD to walk · E to tend, pet, or look</p>
    </main>
    <script>
      var d = document,
        w = "https://tally.so/widgets/embed.js",
        v = function () {
          if (typeof Tally !== "undefined") Tally.loadEmbeds();
          else
            d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function (e) {
              e.src = e.dataset.tallySrc;
            });
        };
      if (typeof Tally !== "undefined") v();
      else if (d.querySelector('script[src="' + w + '"]') == null) {
        var s = d.createElement("script");
        s.src = w;
        s.onload = v;
        s.onerror = v;
        d.body.appendChild(s);
      }
    </script>
    <script src="game.js?v=5"></script>
  </body>
</html>
